spring.application.name=automanager

spring.datasource.url=jdbc:h2:mem:automanager;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Desligado: o console do H2 não passa pela autenticação JWT e expõe o banco. Ligue só em desenvolvimento.
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# JWT (ATVIV)
# Segredo de assinatura (mínimo 32 caracteres). Em produção defina a variável de ambiente JWT_SECRET;
# o valor abaixo é só para desenvolvimento.
jwt.secret=${JWT_SECRET:tfaZb19TP02LghgZILKovRzphIqztOWkKczCCedMvTgeiqDLdweuDypnmm1UxwJz}
# Validade do token em milissegundos (3600000 = 1 hora)
jwt.expiration=3600000
